<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taktiksel EH & Hava Savunma Kapsama Haritası</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; }
        #map { z-index: 10; }
        .control-panel { z-index: 20; }
        
        /* Custom map markers */
        .system-marker-macro {
            background-color: #8b0000;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,0,0,0.8);
        }
        .system-marker-micro {
            background-color: #e63946;
            border: 1px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255,0,0,0.5);
        }
        /* Yeni: Kritik Tesis İkon Stili */
        .facility-marker {
            background-color: #1e293b;
            border: 2px solid #3b82f6;
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
            text-shadow: 0 0 2px rgba(0,0,0,0.8);
        }

        /* Yeni: Scrollbar ve bireysel küçük toggle stilleri */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .toggle-bg-sm { width: 2rem; height: 1.25rem; }
        .dot-sm { width: 0.75rem; height: 0.75rem; top: 0.25rem; left: 0.25rem; }
        input:checked ~ .toggle-bg-sm { background-color: #dc2626; border-color: #ef4444; }
        input:checked ~ .dot-sm { transform: translateX(0.75rem); }
    </style>
</head>
<body class="bg-gray-900 overflow-hidden text-white flex flex-col md:flex-row h-screen w-screen">

    <!-- Harita Konteyneri -->
    <div id="map" class="flex-1 w-full h-[55vh] md:h-full relative"></div>

    <!-- Taktiksel Kontrol Paneli (Yan Menü) -->
    <div class="control-panel w-full md:w-96 h-[45vh] md:h-full bg-gray-900 border-t md:border-t-0 md:border-l border-gray-700 p-5 shadow-2xl flex flex-col overflow-y-auto">
        <div class="flex items-center gap-3 mb-4 border-b border-gray-700 pb-3 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <h1 class="text-lg font-bold text-gray-100 tracking-wide uppercase">C2 EH Komuta Paneli</h1>
        </div>

        <!-- Şehir Seçimi -->
        <div class="mb-5">
            <label class="block text-xs text-gray-400 mb-2 uppercase font-semibold">Operasyon Bölgesi (Pakistan)</label>
            <div class="flex flex-col gap-2 bg-gray-800 rounded-lg p-2 border border-gray-700">
                <button id="btn-islamabad" class="w-full py-2 text-sm font-medium rounded-md transition-colors bg-red-600 text-white shadow-md">İslamabad & Rawalpindi</button>
                <div class="flex gap-2">
                    <button id="btn-karachi" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-300 hover:text-white bg-gray-700">Karaçi</button>
                    <button id="btn-lahore" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-300 hover:text-white bg-gray-700">Lahor</button>
                </div>
            </div>
        </div>

        <!-- Katman Kontrolleri -->
        <div class="space-y-3 flex-1 overflow-hidden flex flex-col">
            <label class="block text-xs text-gray-400 uppercase font-semibold">Tesis Görünürlüğü</label>
            
            <!-- Kritik Tesisler Toggle -->
            <label class="flex items-center justify-between cursor-pointer group pb-3 border-b border-gray-700">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center w-5 h-5 rounded bg-slate-800 border-2 border-blue-500 shadow-[0_0_5px_rgba(59,130,246,0.5)] text-[10px]">🏛️</div>
                    <div>
                        <span class="block text-sm font-medium text-blue-300">Kritik Tesisler</span>
                        <span class="block text-[10px] text-gray-500">Harita İkonları</span>
                    </div>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle-facilities" class="sr-only" checked>
                    <div class="block bg-gray-700 w-10 h-6 rounded-full transition-colors border border-gray-600 toggle-bg-blue"></div>
                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                </div>
            </label>

            <label class="block text-xs text-gray-400 uppercase font-semibold mt-2">Bireysel Sistem Kontrolleri</label>
            
            <!-- Dinamik Sistem Listesi -->
            <div id="dynamic-system-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
                <!-- Javascript ile sistemler buraya doldurulacak -->
            </div>
        </div>

        <div class="mt-5 pt-4 border-t border-gray-700 text-xs text-gray-500 flex justify-between items-center shrink-0">
            <span>Sistem: Aktif ve Çevrimiçi</span>
            <span class="flex h-2 w-2 relative">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
            </span>
        </div>

        <!-- AI Entegrasyon Butonu -->
        <div class="mt-4 shrink-0">
            <button onclick="runAIAnalysis()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-2.5 px-4 rounded-lg shadow-lg hover:shadow-indigo-500/30 transition-all border border-indigo-400/30">
                ✨ Taktiksel AI Analizi
            </button>
        </div>
    </div>

    <!-- AI Analiz Modalı -->
    <div id="ai-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-600 rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col">
            <div class="bg-gray-900 border-b border-gray-700 p-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                    ✨ C2 Yapay Zeka Danışmanı
                </h2>
                <button onclick="closeAIModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 text-sm text-gray-200 min-h-[200px] relative">
                <!-- Yükleniyor Göstergesi -->
                <div id="ai-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-800 z-10">
                    <svg class="animate-spin h-10 w-10 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-indigo-400 animate-pulse font-medium tracking-widest">TAKTIKSEL VERİLER İŞLENİYOR...</p>
                </div>
                <!-- İçerik -->
                <div id="ai-content" class="hidden leading-relaxed space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Tailwind Checkbox Style Override -->
    <style>
        input[id="toggle-facilities"]:checked ~ .toggle-bg-blue { background-color: #2563eb; border-color: #3b82f6; }
        input:checked ~ .dot { transform: translateX(100%); }
        .leaflet-popup-content-wrapper { background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 0.5rem; }
        .leaflet-popup-tip { background: #1f2937; }
        .leaflet-popup-content b { color: #f87171; }
    </style>

    <script>
        // Harita Başlatma
        const map = L.map('map', {
            zoomControl: false // Sağ altta özel kontroller eklenebilir, varsayılanı gizle
        }).setView([33.6844, 73.0479], 10); // İslamabad Merkez

        // Zoom kontrolünü sağ alta alalım
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Taktiksel Uydu Görüntüsü (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP',
            maxZoom: 18
        }).addTo(map);

        // --- Veri Seti ---
        const systemData = {
            islamabad: {
                center: [33.65, 73.06],
                zoom: 11,
                macro: [
                    { id: "isl-mac-1", coords: [33.7294, 73.0931], name: "İslamabad Başkent Ana Sistemi", active: true },
                    { id: "isl-mac-2", coords: [33.5984, 73.0441], name: "Rawalpindi GHQ Ana Sistemi", active: true },
                    { id: "isl-mac-3", coords: [33.6060, 73.3853], name: "Kahuta Stratejik Ana Sistemi", active: true }
                ],
                micro: [
                    { id: "isl-mic-1", coords: [33.7298, 73.0984], name: "Parlamento Binası (Sabit)", active: true },
                    { id: "isl-mic-2", coords: [33.6262, 73.0967], name: "Nur Khan Hava Üssü (Sabit)", active: true },
                    { id: "isl-mic-3", coords: [33.5850, 73.0370], name: "GHQ Genelkurmay Başkanlığı (Sabit)", active: true },
                    { id: "isl-mic-4", coords: [33.6055, 73.3855], name: "Kahuta Nükleer Tesisi (Sabit)", active: true },
                    { id: "isl-mic-5", coords: [33.6844, 73.0479], name: "Diplomatik Bölge Koruma (Mobil)", active: true }
                ],
                facilities: [
                    { coords: [33.7298, 73.0984], name: "Pakistan Parlamentosu", icon: "🏛️" },
                    { coords: [33.6262, 73.0967], name: "Nur Khan Hava Üssü", icon: "✈️" },
                    { coords: [33.5850, 73.0370], name: "GHQ Rawalpindi", icon: "🛡️" },
                    { coords: [33.6055, 73.3855], name: "KRL Kahuta Nükleer", icon: "⚡" }
                ]
            },
            karachi: {
                center: [24.86, 67.01],
                zoom: 11,
                macro: [
                    { id: "kar-mac-1", coords: [24.8140, 66.9740], name: "Karaçi Limanı Ana Sistemi", active: true },
                    { id: "kar-mac-2", coords: [24.8716, 67.1478], name: "Jinnah & Malir Ana Sistemi", active: true },
                    { id: "kar-mac-3", coords: [24.8967, 66.9472], name: "Masroor Hava Üssü Ana Sistemi", active: true }
                ],
                micro: [
                    { id: "kar-mic-1", coords: [24.8140, 66.9740], name: "PNS Dockyard / Deniz Üssü (Sabit)", active: true },
                    { id: "kar-mic-2", coords: [24.9060, 67.1680], name: "Jinnah Uluslararası Havalimanı (Sabit)", active: true },
                    { id: "kar-mic-3", coords: [24.8722, 67.1122], name: "PNS Mehran Deniz Hava Üssü (Sabit)", active: true },
                    { id: "kar-mic-4", coords: [24.8465, 66.7865], name: "KANUPP Nükleer Santrali (Sabit)", active: true },
                    { id: "kar-mic-5", coords: [24.8500, 67.0000], name: "VIP İntikal Aracı (Mobil)", active: true }
                ],
                facilities: [
                    { coords: [24.8140, 66.9740], name: "Karaçi Deniz Üssü", icon: "⚓" },
                    { coords: [24.9060, 67.1680], name: "Jinnah Havalimanı", icon: "✈️" },
                    { coords: [24.8967, 66.9472], name: "Masroor Hava Üssü", icon: "✈️" },
                    { coords: [24.8465, 66.7865], name: "KANUPP Nükleer Tesisi", icon: "⚡" }
                ]
            },
            lahore: {
                center: [31.52, 74.34],
                zoom: 11,
                macro: [
                    { id: "lah-mac-1", coords: [31.5204, 74.3587], name: "Lahor Merkez Ana Sistemi", active: true },
                    { id: "lah-mac-2", coords: [31.5830, 74.5720], name: "Doğu Sınır Hattı Ana Sistemi", active: true }
                ],
                micro: [
                    { id: "lah-mic-1", coords: [31.5216, 74.4036], name: "Lahor Cantonment (Sabit)", active: true },
                    { id: "lah-mic-2", coords: [31.5284, 74.4058], name: "Kolordu Karargâhı (Sabit)", active: true },
                    { id: "lah-mic-3", coords: [31.5210, 74.4095], name: "Allama Iqbal Havalimanı (Sabit)", active: true },
                    { id: "lah-mic-4", coords: [31.6045, 74.5735], name: "Wagah Sınır Kapısı (Sabit)", active: true }
                ],
                facilities: [
                    { coords: [31.5216, 74.4036], name: "Lahor Cantonment", icon: "🛡️" },
                    { coords: [31.5210, 74.4095], name: "Allama Iqbal Havalimanı", icon: "✈️" },
                    { coords: [31.6045, 74.5735], name: "Wagah Sınırı", icon: "🚧" }
                ]
            }
        };

        let activeLayers = [];
        let currentCity = 'islamabad';

        // Özel İkonlar (Noktalar)
        const macroIcon = L.divIcon({ className: 'system-marker-macro', iconSize: [12, 12] });
        const microIcon = L.divIcon({ className: 'system-marker-micro', iconSize: [10, 10] });

        // Dinamik Toggle Listesini Oluşturma Fonksiyonu
        function buildSystemToggles() {
            const container = document.getElementById('dynamic-system-list');
            container.innerHTML = '';
            const data = systemData[currentCity];

            const createToggleHTML = (sys, type) => {
                const isMacro = type === 'macro';
                const dotColor = isMacro ? 'bg-red-800 border-red-500 shadow-[0_0_5px_rgba(255,0,0,0.8)]' : 'bg-red-500 border-red-300 shadow-[0_0_5px_rgba(255,0,0,0.5)]';
                const titleStr = isMacro ? 'Makro Katman (20km)' : 'Mikro Katman (5km)';
                
                const div = document.createElement('label');
                div.className = "flex items-center justify-between cursor-pointer group bg-gray-800/40 p-2 rounded border border-gray-700 hover:bg-gray-700/60 transition-colors";
                div.innerHTML = `
                    <div class="flex items-center gap-2 w-3/4">
                        <div class="w-2.5 h-2.5 rounded-full border ${dotColor} shrink-0"></div>
                        <div class="overflow-hidden">
                            <span class="block text-[10px] text-gray-400 leading-tight">${titleStr}</span>
                            <span class="block text-[13px] font-medium text-gray-200 truncate" title="${sys.name}">${sys.name}</span>
                        </div>
                    </div>
                    <div class="relative shrink-0">
                        <input type="checkbox" class="sr-only sys-toggle" data-id="${sys.id}" data-type="${type}" ${sys.active ? 'checked' : ''}>
                        <div class="block bg-gray-700 toggle-bg-sm rounded-full transition-colors border border-gray-600"></div>
                        <div class="dot-sm absolute bg-white rounded-full transition-transform"></div>
                    </div>
                `;
                container.appendChild(div);
            };

            // Önce makro, sonra mikro sistemleri listele
            data.macro.forEach(sys => createToggleHTML(sys, 'macro'));
            data.micro.forEach(sys => createToggleHTML(sys, 'micro'));

            // Toggle'lara tıklama olayını ekle
            document.querySelectorAll('.sys-toggle').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const id = e.target.dataset.id;
                    const type = e.target.dataset.type;
                    const sys = systemData[currentCity][type].find(s => s.id === id);
                    if(sys) {
                        sys.active = e.target.checked;
                        renderMap();
                    }
                });
            });
        }

        // Haritayı Çizdirme Fonksiyonu
        function renderMap() {
            // Mevcut katmanları temizle
            activeLayers.forEach(layer => map.removeLayer(layer));
            activeLayers = [];

            const data = systemData[currentCity];
            const showFacilities = document.getElementById('toggle-facilities').checked;

            if (showFacilities) {
                data.facilities.forEach(fac => {
                    let facIcon = L.divIcon({
                        className: 'facility-marker',
                        html: `<span>${fac.icon}</span>`,
                        iconSize: [26, 26],
                        iconAnchor: [13, 13]
                    });
                    
                    let marker = L.marker(fac.coords, { icon: facIcon, zIndexOffset: 1000 }).addTo(map);
                    marker.bindPopup(`<b style="color:#60a5fa">Kritik Tesis</b><br/>${fac.name}`);
                    activeLayers.push(marker);
                });
            }

            // Makro Sistemleri Çiz (Sadece aktif olanlar)
            data.macro.forEach(sys => {
                if (!sys.active) return; // Kapalıysa atla
                
                let circle = L.circle(sys.coords, {
                    radius: 20000,
                    color: '#ef4444',     
                    weight: 2,            
                    dashArray: '5, 8',
                    fillColor: '#ef4444', 
                    fillOpacity: 0.2      
                }).addTo(map);
                
                circle.bindPopup(`<b>Makro Katman (20 km)</b><br/>${sys.name}`);
                activeLayers.push(circle);

                let marker = L.marker(sys.coords, { icon: macroIcon }).addTo(map);
                marker.bindPopup(`<b>Sistem:</b> ${sys.name}<br/><b>Tür:</b> 360° Yönlü Kapama<br/><b>Durum:</b> Aktif`);
                activeLayers.push(marker);
            });

            // Mikro Sistemleri Çiz (Sadece aktif olanlar)
            data.micro.forEach(sys => {
                if (!sys.active) return; // Kapalıysa atla

                const isMobile = sys.name.includes('(Mobil)');
                const dashStyle = isMobile ? '3, 4' : '';
                
                let circle = L.circle(sys.coords, {
                    radius: 5000,
                    color: isMobile ? '#f59e0b' : '#dc2626', 
                    weight: 2.5,
                    dashArray: dashStyle,
                    fillColor: isMobile ? '#f59e0b' : '#dc2626',
                    fillOpacity: 0.35 
                }).addTo(map);
                
                circle.bindPopup(`<b>Mikro Katman (5 km)</b><br/>${sys.name}`);
                activeLayers.push(circle);

                let marker = L.marker(sys.coords, { icon: microIcon }).addTo(map);
                marker.bindPopup(`<b>Sistem:</b> ${sys.name}<br/><b>Tür:</b> Nokta Savunması<br/><b>Durum:</b> Aktif`);
                activeLayers.push(marker);
            });
        }

        // Şehir Değiştirme Animasyonu ve Veri Güncelleme
        function setCity(city) {
            currentCity = city;
            const data = systemData[city];
            
            // Yeni şehre göre sağ menüdeki listeyi baştan oluştur
            buildSystemToggles();

            // Haritayı kaydır ve yakınlaştır
            setTimeout(() => {
                map.invalidateSize(); // Flex layout değişikliğinde haritayı uyar
                map.flyTo(data.center, data.zoom, {
                    duration: 1.5,
                    easeLinearity: 0.25
                });
            }, 100);

            // Buton UI Güncelleme
            const btnI = document.getElementById('btn-islamabad');
            const btnK = document.getElementById('btn-karachi');
            const btnL = document.getElementById('btn-lahore');

            // Tüm butonları pasif duruma getir
            [btnI, btnK, btnL].forEach(btn => {
                btn.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-300 hover:text-white bg-gray-700 w-full";
            });

            // Aktif olanı vurgula
            if (city === 'islamabad') btnI.className = "w-full py-2 text-sm font-medium rounded-md transition-colors bg-red-600 text-white shadow-md";
            if (city === 'karachi') btnK.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-red-600 text-white shadow-md w-full";
            if (city === 'lahore') btnL.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-red-600 text-white shadow-md w-full";

            // Yeniden çiz
            setTimeout(renderMap, 400);
        }

        // Event Listeners
        document.getElementById('btn-islamabad').addEventListener('click', () => setCity('islamabad'));
        document.getElementById('btn-karachi').addEventListener('click', () => setCity('karachi'));
        document.getElementById('btn-lahore').addEventListener('click', () => setCity('lahore'));
        document.getElementById('toggle-facilities').addEventListener('change', renderMap);

        // Başlangıç Çizimi
        buildSystemToggles();
        renderMap();

        // --- GEMINI API ENTEGRASYONU ---
        const apiKey = ""; // API Key çalışma zamanında otomatik eklenecektir

        async function fetchAIAnalysisWithRetry(prompt, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { 
                    parts: [{ text: "Sen kıdemli bir Taktiksel Elektronik Harp (EH) ve Hava Savunma Danışmanısın. Yanıtlarını her zaman askeri, profesyonel, net ve analitik bir dilde ver." }] 
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Değerlendirme oluşturulamadı.";
                } catch (e) {
                    if (i === retries - 1) return "C2 Ağına bağlantı kurulamadı. Taktiksel AI sunucusu yanıt vermiyor.";
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        async function runAIAnalysis() {
            const modal = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            const loader = document.getElementById('ai-loader');
            
            modal.classList.remove('hidden');
            content.classList.add('hidden');
            loader.classList.remove('hidden');

            const cityNames = { 'islamabad': 'İslamabad & Rawalpindi', 'karachi': 'Karaçi', 'lahore': 'Lahor' };
            const cityName = cityNames[currentCity];
            const data = systemData[currentCity];
            
            // Hangi sistemlerin aktif hangilerinin kapalı olduğunu ayıkla
            const activeMacros = data.macro.filter(s => s.active).map(s => s.name);
            const activeMicros = data.micro.filter(s => s.active).map(s => s.name);
            const inactiveSystems = [...data.macro.filter(s => !s.active), ...data.micro.filter(s => !s.active)].map(s => s.name);
            const facilities = data.facilities.map(m => m.name).join(', ');

            const prompt = `Şu an ${cityName} şehri için EH ve Hava Savunma komuta ekranını inceliyoruz.
Durum Özeti:
- Aktif 20km Makro Sistemler: ${activeMacros.length > 0 ? activeMacros.join(', ') : 'HİÇBİRİ AKTİF DEĞİL'}
- Aktif 5km Mikro Sistemler: ${activeMicros.length > 0 ? activeMicros.join(', ') : 'HİÇBİRİ AKTİF DEĞİL'}
- Kapalı/Devre Dışı Olan Sistemler: ${inactiveSystems.length > 0 ? inactiveSystems.join(', ') : 'YOK, tüm sistemler devrede.'}
- Korunan Kritik Tesisler: ${facilities}.

Lütfen bu mevcut savunma postürüne (hangi cihazların açık/kapalı olduğuna) göre:
1. Durumsal farkındalık özeti oluştur. Eğer kapalı sistemler varsa kör noktalar oluştuğunu vurgula.
2. Asimetrik İHA/FPV sürüsü saldırısı risklerini değerlendir.
3. Sahadaki operatörlere bir sonraki adım için taktiksel bir tavsiye ver.
Maddeler halinde, toplamda maksimum 150 kelimelik kısa ve öz bir askeri rapor hazırla.`;

            const responseText = await fetchAIAnalysisWithRetry(prompt);
            
            // Basit Markdown formatını HTML'e çevirme (Kalın yazılar ve alt satıra geçişler)
            let formattedText = responseText
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<b class="text-indigo-300">$1</b>')
                .replace(/\*(.*?)\*/g, '<i class="text-gray-400">$1</i>');
            
            content.innerHTML = formattedText;
            loader.classList.add('hidden');
            content.classList.remove('hidden');
        }

        function closeAIModal() {
            document.getElementById('ai-modal').classList.add('hidden');
        }

    </script>
</body>
</html>
