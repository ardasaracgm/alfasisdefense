<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taktiksel EH & Hava Savunma Kapsama Haritası</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; }
        #map { z-index: 10; }
        .control-panel { z-index: 20; }
        
        /* Custom map markers */
        .system-marker-macro {
            background-color: #8b0000;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,0,0,0.8);
        }
        .system-marker-micro {
            background-color: #e63946;
            border: 1px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(255,0,0,0.5);
        }
        /* Yeni: Kritik Tesis İkon Stili */
        .facility-marker {
            background-color: #1e293b;
            border: 2px solid #3b82f6;
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
            text-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="bg-gray-900 overflow-hidden text-white flex flex-col md:flex-row h-screen w-screen">

    <!-- Harita Konteyneri -->
    <div id="map" class="flex-1 w-full h-[55vh] md:h-full relative"></div>

    <!-- Taktiksel Kontrol Paneli (Yan Menü) -->
    <div class="control-panel w-full md:w-96 h-[45vh] md:h-full bg-gray-900 border-t md:border-t-0 md:border-l border-gray-700 p-5 shadow-2xl flex flex-col overflow-y-auto">
        <div class="flex items-center gap-3 mb-4 border-b border-gray-700 pb-3 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <h1 class="text-lg font-bold text-gray-100 tracking-wide uppercase">C2 EH Komuta Paneli</h1>
        </div>

        <!-- Şehir Seçimi -->
        <div class="mb-5">
            <label class="block text-xs text-gray-400 mb-2 uppercase font-semibold">Operasyon Bölgesi</label>
            <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700">
                <button id="btn-hartum" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-red-600 text-white shadow-md">Hartum</button>
                <button id="btn-portsudan" class="flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-300 hover:text-white">Port Sudan</button>
            </div>
        </div>

        <!-- Katman Kontrolleri -->
        <div class="space-y-4">
            <label class="block text-xs text-gray-400 uppercase font-semibold">Aktif Savunma Katmanları</label>
            
            <!-- Makro Toggle -->
            <label class="flex items-center justify-between cursor-pointer group">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-red-800 border border-red-500 shadow-[0_0_8px_rgba(255,0,0,0.6)]"></div>
                    <div>
                        <span class="block text-sm font-medium text-gray-200">Makro Sistemler</span>
                        <span class="block text-xs text-gray-500">20 km Etkin Mesafe (Sabit)</span>
                    </div>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle-macro" class="sr-only" checked>
                    <div class="block bg-gray-700 w-10 h-6 rounded-full transition-colors border border-gray-600 toggle-bg"></div>
                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                </div>
            </label>

            <!-- Mikro Toggle -->
            <label class="flex items-center justify-between cursor-pointer group">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-red-500 border border-red-300 shadow-[0_0_5px_rgba(255,0,0,0.8)]"></div>
                    <div>
                        <span class="block text-sm font-medium text-gray-200">Mikro Sistemler</span>
                        <span class="block text-xs text-gray-500">5 km Etkin Mesafe (Sabit/Mobil)</span>
                    </div>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle-micro" class="sr-only" checked>
                    <div class="block bg-gray-700 w-10 h-6 rounded-full transition-colors border border-gray-600 toggle-bg"></div>
                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                </div>
            </label>

            <!-- Yeni: Kritik Tesisler Toggle -->
            <label class="flex items-center justify-between cursor-pointer group mt-2 pt-2 border-t border-gray-700">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center w-5 h-5 rounded bg-slate-800 border-2 border-blue-500 shadow-[0_0_5px_rgba(59,130,246,0.5)] text-[10px]">🏛️</div>
                    <div>
                        <span class="block text-sm font-medium text-blue-300">Kritik Tesisler</span>
                        <span class="block text-xs text-gray-500">Liman, Havalimanı, Devlet Binaları</span>
                    </div>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle-facilities" class="sr-only" checked>
                    <div class="block bg-gray-700 w-10 h-6 rounded-full transition-colors border border-gray-600 toggle-bg-blue"></div>
                    <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
                </div>
            </label>
        </div>

        <div class="mt-5 pt-4 border-t border-gray-700 text-xs text-gray-500 flex justify-between items-center shrink-0">
            <span>Sistem: Aktif ve Çevrimiçi</span>
            <span class="flex h-2 w-2 relative">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
            </span>
        </div>

        <!-- AI Entegrasyon Butonu -->
        <div class="mt-4 shrink-0">
            <button onclick="runAIAnalysis()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-2.5 px-4 rounded-lg shadow-lg hover:shadow-indigo-500/30 transition-all border border-indigo-400/30">
                ✨ Taktiksel AI Analizi
            </button>
        </div>
    </div>

    <!-- AI Analiz Modalı -->
    <div id="ai-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-600 rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col">
            <div class="bg-gray-900 border-b border-gray-700 p-4 flex justify-between items-center">
                <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                    ✨ C2 Yapay Zeka Danışmanı
                </h2>
                <button onclick="closeAIModal()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 text-sm text-gray-200 min-h-[200px] relative">
                <!-- Yükleniyor Göstergesi -->
                <div id="ai-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-800 z-10">
                    <svg class="animate-spin h-10 w-10 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-indigo-400 animate-pulse font-medium tracking-widest">TAKTIKSEL VERİLER İŞLENİYOR...</p>
                </div>
                <!-- İçerik -->
                <div id="ai-content" class="hidden leading-relaxed space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Tailwind Checkbox Style Override -->
    <style>
        input:checked ~ .toggle-bg { background-color: #dc2626; border-color: #ef4444; }
        input[id="toggle-facilities"]:checked ~ .toggle-bg-blue { background-color: #2563eb; border-color: #3b82f6; }
        input:checked ~ .dot { transform: translateX(100%); }
        .leaflet-popup-content-wrapper { background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 0.5rem; }
        .leaflet-popup-tip { background: #1f2937; }
        .leaflet-popup-content b { color: #f87171; }
    </style>

    <script>
        // Harita Başlatma
        const map = L.map('map', {
            zoomControl: false // Sağ altta özel kontroller eklenebilir, varsayılanı gizle
        }).setView([15.58, 32.53], 11);

        // Zoom kontrolünü sağ alta alalım
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Taktiksel Uydu Görüntüsü (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP',
            maxZoom: 18
        }).addTo(map);

        // --- Veri Seti ---
        const systemData = {
            khartoum: {
                center: [15.63, 32.52], // Hartum Merkez
                zoom: 11,
                macro: [
                    { coords: [15.589, 32.553], name: "Merkez Hartum & Havalimanı Ana Sistemi" },
                    { coords: [15.650, 32.480], name: "Omdurman Bölgesi Ana Sistemi" },
                    { coords: [15.660, 32.555], name: "Bahri (Kuzey) Sanayi Ana Sistemi" }
                ],
                micro: [
                    { coords: [15.610, 32.527], name: "Cumhurbaşkanlığı Sarayı (Sabit)" },
                    { coords: [15.602, 32.540], name: "Genelkurmay Karargâhı (Sabit)" },
                    { coords: [15.820, 32.518], name: "Wadi Seidna Hava Üssü (Sabit)" },
                    { coords: [15.615, 32.515], name: "Mak Nimir Köprüsü (Sabit)" },
                    { coords: [15.655, 32.560], name: "Kuzey Elektrik Santrali (Sabit)" },
                    { coords: [15.630, 32.480], name: "Omdurman Radyo/TV İstasyonu (Sabit)" },
                    { coords: [15.580, 32.560], name: "VIP Eskort Bekleme Noktası 1 (Mobil)" },
                    { coords: [15.640, 32.500], name: "VIP Eskort Bekleme Noktası 2 (Mobil)" }
                ],
                facilities: [
                    { coords: [15.589, 32.553], name: "Hartum Uluslararası Havalimanı", icon: "✈️" },
                    { coords: [15.610, 32.527], name: "Cumhurbaşkanlığı Sarayı", icon: "🏛️" },
                    { coords: [15.602, 32.540], name: "Genelkurmay Karargâhı", icon: "🛡️" },
                    { coords: [15.820, 32.518], name: "Wadi Seidna Hava Üssü", icon: "✈️" },
                    { coords: [15.655, 32.560], name: "Kuzey Elektrik Santrali", icon: "⚡" },
                    { coords: [15.615, 32.515], name: "Mak Nimir Köprüsü", icon: "🌉" }
                ]
            },
            portsudan: {
                center: [19.53, 37.22], // Port Sudan Merkez ile Havalimanı arası
                zoom: 11,
                macro: [
                    { coords: [19.615, 37.216], name: "Şehir Merkezi ve Deniz Limanı Ana Sistemi" },
                    { coords: [19.434, 37.234], name: "Uluslararası Havalimanı Ana Sistemi" }
                ],
                micro: [
                    { coords: [19.623, 37.233], name: "Konteyner Terminali (Sabit)" },
                    { coords: [19.645, 37.240], name: "Petrol Rafinerisi (Sabit)" },
                    { coords: [19.640, 37.220], name: "Flamingo Bay Deniz Üssü (Sabit)" },
                    { coords: [19.610, 37.210], name: "Yerel Askeri Karargâh (Sabit)" },
                    { coords: [19.618, 37.225], name: "Liman İçi Dinamik Koruma (Mobil)" },
                    { coords: [19.530, 37.225], name: "Havalimanı İntikal Koruma (Mobil)" }
                ],
                facilities: [
                    { coords: [19.623, 37.233], name: "Konteyner Terminali (Liman)", icon: "⚓" },
                    { coords: [19.434, 37.234], name: "Port Sudan Havalimanı", icon: "✈️" },
                    { coords: [19.645, 37.240], name: "Petrol Rafinerisi", icon: "🏭" },
                    { coords: [19.640, 37.220], name: "Flamingo Bay Deniz Üssü", icon: "🛡️" },
                    { coords: [19.610, 37.210], name: "Hükümet Binası", icon: "🏛️" }
                ]
            }
        };

        let activeLayers = [];
        let currentCity = 'khartoum';

        // Özel İkonlar (Noktalar)
        const macroIcon = L.divIcon({ className: 'system-marker-macro', iconSize: [12, 12] });
        const microIcon = L.divIcon({ className: 'system-marker-micro', iconSize: [10, 10] });

        // Haritayı Çizdirme Fonksiyonu
        function renderMap() {
            // Mevcut katmanları temizle
            activeLayers.forEach(layer => map.removeLayer(layer));
            activeLayers = [];

            const data = systemData[currentCity];
            const showMacro = document.getElementById('toggle-macro').checked;
            const showMicro = document.getElementById('toggle-micro').checked;
            const showFacilities = document.getElementById('toggle-facilities').checked;

            if (showFacilities) {
                data.facilities.forEach(fac => {
                    let facIcon = L.divIcon({
                        className: 'facility-marker',
                        html: `<span>${fac.icon}</span>`,
                        iconSize: [26, 26],
                        iconAnchor: [13, 13]
                    });
                    
                    let marker = L.marker(fac.coords, { icon: facIcon, zIndexOffset: 1000 }).addTo(map);
                    marker.bindPopup(`<b style="color:#60a5fa">Kritik Tesis</b><br/>${fac.name}`);
                    activeLayers.push(marker);
                });
            }

            if (showMacro) {
                data.macro.forEach(sys => {
                    // Kapsama Alanı Çemberi (20 km = 20000 metre)
                    let circle = L.circle(sys.coords, {
                        radius: 20000,
                        color: '#ef4444',     // Kırmızı Kenarlık
                        weight: 2,            // Uydu üzerinde görünmesi için kalınlaştırıldı
                        dashArray: '5, 8',
                        fillColor: '#ef4444', // Kırmızı Dolgu
                        fillOpacity: 0.2      // Uydu üzerinde görünmesi için artırıldı
                    }).addTo(map);
                    
                    circle.bindPopup(`<b>Makro Katman (20 km)</b><br/>${sys.name}`);
                    activeLayers.push(circle);

                    // Merkez Noktası
                    let marker = L.marker(sys.coords, { icon: macroIcon }).addTo(map);
                    marker.bindPopup(`<b>Sistem:</b> ${sys.name}<br/><b>Tür:</b> 360° Yönlü Kapama<br/><b>Durum:</b> Aktif`);
                    activeLayers.push(marker);
                });
            }

            if (showMicro) {
                data.micro.forEach(sys => {
                    const isMobile = sys.name.includes('(Mobil)');
                    const dashStyle = isMobile ? '3, 4' : '';
                    
                    // Kapsama Alanı Çemberi (5 km = 5000 metre)
                    let circle = L.circle(sys.coords, {
                        radius: 5000,
                        color: isMobile ? '#f59e0b' : '#dc2626', // Mobil ise Turuncu/Sarımsı, Sabit ise koyu kırmızı
                        weight: 2.5,
                        dashArray: dashStyle,
                        fillColor: isMobile ? '#f59e0b' : '#dc2626',
                        fillOpacity: 0.35 // Uydu üzerinde daha belirgin olması için artırıldı
                    }).addTo(map);
                    
                    circle.bindPopup(`<b>Mikro Katman (5 km)</b><br/>${sys.name}`);
                    activeLayers.push(circle);

                    // Merkez Noktası
                    let marker = L.marker(sys.coords, { icon: microIcon }).addTo(map);
                    marker.bindPopup(`<b>Sistem:</b> ${sys.name}<br/><b>Tür:</b> Nokta Savunması<br/><b>Durum:</b> Aktif`);
                    activeLayers.push(marker);
                });
            }
        }

        // Şehir Değiştirme Animasyonu ve Veri Güncelleme
        function setCity(city) {
            currentCity = city;
            const data = systemData[city];
            
            // Haritayı kaydır ve yakınlaştır (setTimeout ekleyerek layout oturduktan sonra render olmasını sağladık)
            setTimeout(() => {
                map.invalidateSize(); // Flex layout değişikliğinde haritayı uyar
                map.flyTo(data.center, data.zoom, {
                    duration: 1.5,
                    easeLinearity: 0.25
                });
            }, 100);

            // Buton UI Güncelleme
            const btnH = document.getElementById('btn-hartum');
            const btnP = document.getElementById('btn-portsudan');

            if (city === 'khartoum') {
                btnH.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-red-600 text-white shadow-md";
                btnP.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-300 hover:text-white";
            } else {
                btnP.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors bg-red-600 text-white shadow-md";
                btnH.className = "flex-1 py-2 text-sm font-medium rounded-md transition-colors text-gray-300 hover:text-white";
            }

            // Yeniden çiz (Animasyon bittikten biraz sonra çizmek daha şık durur)
            setTimeout(renderMap, 400);
        }

        // Event Listeners
        document.getElementById('btn-hartum').addEventListener('click', () => setCity('khartoum'));
        document.getElementById('btn-portsudan').addEventListener('click', () => setCity('portsudan'));
        document.getElementById('toggle-macro').addEventListener('change', renderMap);
        document.getElementById('toggle-micro').addEventListener('change', renderMap);
        document.getElementById('toggle-facilities').addEventListener('change', renderMap);

        // Başlangıç Çizimi
        renderMap();

        // --- GEMINI API ENTEGRASYONU ---
        const apiKey = ""; // API Key çalışma zamanında otomatik eklenecektir

        async function fetchAIAnalysisWithRetry(prompt, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { 
                    parts: [{ text: "Sen kıdemli bir Taktiksel Elektronik Harp (EH) ve Hava Savunma Danışmanısın. Yanıtlarını her zaman askeri, profesyonel, net ve analitik bir dilde ver." }] 
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Değerlendirme oluşturulamadı.";
                } catch (e) {
                    if (i === retries - 1) return "C2 Ağına bağlantı kurulamadı. Taktiksel AI sunucusu yanıt vermiyor.";
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        async function runAIAnalysis() {
            const modal = document.getElementById('ai-modal');
            const content = document.getElementById('ai-content');
            const loader = document.getElementById('ai-loader');
            
            modal.classList.remove('hidden');
            content.classList.add('hidden');
            loader.classList.remove('hidden');

            const showMacro = document.getElementById('toggle-macro').checked;
            const showMicro = document.getElementById('toggle-micro').checked;
            const cityName = currentCity === 'khartoum' ? 'Hartum' : 'Port Sudan';
            const facilities = systemData[currentCity].micro.map(m => m.name).join(', ');

            const prompt = `Şu an ${cityName} şehri için EH ve Hava Savunma komuta ekranını inceliyoruz.
Durum Özeti:
- 20km Etkin Mesafeli Makro Sistemler: ${showMacro ? 'AKTİF VE ÇEVRİMİÇİ' : 'DEVRE DIŞI / KAPALI'}
- 5km Etkin Mesafeli Mikro/Nokta Sistemler: ${showMicro ? 'AKTİF VE ÇEVRİMİÇİ' : 'DEVRE DIŞI / KAPALI'}
- Korunan Tesiler/Bölgeler: ${facilities}.

Lütfen bu mevcut savunma postürüne göre:
1. Durumsal farkındalık özeti oluştur.
2. Açık/Kapalı olan katmanlara göre asimetrik İHA/FPv sürüsü saldırısı risklerini ve zayıf/güçlü yönleri değerlendir.
3. Sahadaki operatörlere bir sonraki adım için taktiksel bir tavsiye ver.
Maddeler halinde, toplamda maksimum 150 kelimelik kısa ve öz bir rapor hazırla.`;

            const responseText = await fetchAIAnalysisWithRetry(prompt);
            
            // Basit Markdown formatını HTML'e çevirme (Kalın yazılar ve alt satıra geçişler)
            let formattedText = responseText
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<b class="text-indigo-300">$1</b>')
                .replace(/\*(.*?)\*/g, '<i class="text-gray-400">$1</i>');
            
            content.innerHTML = formattedText;
            loader.classList.add('hidden');
            content.classList.remove('hidden');
        }

        function closeAIModal() {
            document.getElementById('ai-modal').classList.add('hidden');
        }

    </script>
</body>
</html>
